[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investfacil"
version = "0.2.0"
description = "Plataforma educacional e experimental para pesquisa, simulacao e automacao segura de operacoes financeiras."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Walter Baleco" }
]

dependencies = [
    "pandas>=2.2,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
painel = [
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
]

aprendizado = [
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
]

metatrader = [
    "MetaTrader5>=5.0; platform_system == 'Windows'",
]

desenvolvimento = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]
[tool.setuptools]
package-dir = { "" = "codigo_fonte" }

[tool.setuptools.packages.find]
where = ["codigo_fonte"]
include = ["investfacil*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["codigo_fonte"]
addopts = "-ra --strict-markers"